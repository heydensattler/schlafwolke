<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schlafwolke</title>
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a2e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schlafwolke">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="kopf">
  <div class="marke"><img src="icons/icon.svg" alt="" width="28" height="28"> Schlafwolke</div>
  <div id="baby-kurz" class="baby-kurz"></div>
</header>

<main>
  <section id="v-schlaf" class="ansicht"></section>
  <section id="v-essen" class="ansicht"></section>
  <section id="v-verlauf" class="ansicht"></section>
  <section id="v-wetter" class="ansicht"></section>
  <section id="v-profil" class="ansicht"></section>
</main>

<nav class="leiste" aria-label="Bereiche">
  <button data-v="schlaf"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span>Schlaf</span></button>
  <button data-v="essen"><svg viewBox="0 0 24 24"><path d="M9 2h6M10 2v3l-2 3v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V8l-2-3V2M8 12h8"/></svg><span>Füttern</span></button>
  <button data-v="verlauf"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Verlauf</span></button>
  <button data-v="wetter"><svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.6 1.5A3.3 3.3 0 0 0 7 18z"/></svg><span>Wetter</span></button>
  <button data-v="profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Baby</span></button>
</nav>

<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>

<script src="app.js"></script>
<script src="wetter.js"></script>
<script src="beikost.js"></script>
</body>
</html>
